<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Favorites — AB Dictionary</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;

        background: radial-gradient(
          circle at top,
          #202024 0%,
          #0b0b0d 45%,
          #080809 100%
        );

        color: #f5f5f5;

        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .container {
        width: min(1100px, calc(100% - 32px));

        margin: auto;

        padding: 45px 0 70px;
      }

      .back {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        color: #999;

        text-decoration: none;

        font-size: 14px;

        margin-bottom: 30px;

        transition:
          color 0.2s ease,
          transform 0.2s ease;
      }

      .back:hover {
        color: white;

        transform: translateX(-3px);
      }

      .eyebrow {
        color: #8b5cf6;

        font-size: 12px;

        font-weight: 800;

        letter-spacing: 2px;

        text-transform: uppercase;
      }

      h1 {
        margin: 8px 0 8px;

        font-size: clamp(34px, 6vw, 58px);

        letter-spacing: -2px;
      }

      .subtitle {
        color: #888;

        font-size: 16px;
      }

      .favorites-grid {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

        gap: 16px;

        margin-top: 35px;
      }

      .favorite-card {
        position: relative;

        padding: 23px;

        border: 1px solid rgba(255, 255, 255, 0.08);

        border-radius: 18px;

        background: rgba(255, 255, 255, 0.035);

        backdrop-filter: blur(12px);

        transition:
          transform 0.25s ease,
          border-color 0.25s ease;
      }

      .favorite-card:hover {
        transform: translateY(-5px);

        border-color: rgba(139, 92, 246, 0.45);
      }

      .card-top {
        display: flex;

        align-items: flex-start;

        justify-content: space-between;

        gap: 15px;
      }

      .word {
        margin: 0;

        font-size: 27px;
      }

      .part {
        display: inline-block;

        margin-top: 7px;

        color: #8b5cf6;

        font-size: 12px;

        font-weight: 700;
      }

      .remove {
        border: 0;

        background: rgba(255, 255, 255, 0.06);

        color: #aaa;

        width: 34px;

        height: 34px;

        border-radius: 50%;

        cursor: pointer;

        font-size: 17px;

        transition: 0.2s ease;
      }

      .remove:hover {
        color: white;

        background: rgba(239, 68, 68, 0.2);
      }

      .meaning {
        margin: 20px 0 8px;

        color: #ddd;

        line-height: 1.6;
      }

      .bangla {
        margin: 0;

        color: #aaa;

        line-height: 1.6;
      }

      .difficulty {
        display: inline-block;

        margin-top: 18px;

        padding: 5px 9px;

        border-radius: 8px;

        background: rgba(255, 255, 255, 0.06);

        color: #aaa;

        font-size: 11px;

        font-weight: 700;
      }

      .empty {
        margin-top: 35px;

        padding: 70px 20px;

        text-align: center;

        border: 1px dashed #333;

        border-radius: 20px;

        color: #888;
      }

      .empty-icon {
        font-size: 45px;

        margin-bottom: 15px;
      }

      .empty h2 {
        margin: 0 0 8px;

        color: #ddd;
      }

      .empty p {
        margin: 0 0 22px;
      }

      .browse {
        display: inline-block;

        padding: 11px 18px;

        border-radius: 10px;

        background: #8b5cf6;

        color: white;

        text-decoration: none;

        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <a href="dictionary.html" class="back"> ← Back to Dictionary </a>

      <div class="eyebrow">AB DICTIONARY</div>

      <h1>My Favorites ⭐</h1>

      <div class="subtitle" id="stats">Loading favorites...</div>

      <main id="favorites" class="favorites-grid"></main>
    </div>

    <script>
      const FAVORITES_KEY = "abDictionaryFavorites";

      const container = document.getElementById("favorites");

      const stats = document.getElementById("stats");

      let allWords = [];

      /* ================= LOAD DICTIONARY ================= */

      async function loadWords() {
        try {
          const response = await fetch("data/words.json");

          if (!response.ok) {
            throw new Error("Could not load words.json");
          }

          allWords = await response.json();

          renderFavorites();
        } catch (error) {
          console.error(error);

          container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h2>
                    Unable to load dictionary
                </h2>

                <p>
                    Make sure
                    data/words.json
                    exists.
                </p>

            </div>

        `;
        }
      }

      /* ================= GET FAVORITES ================= */

      function getFavorites() {
        try {
          const saved = localStorage.getItem(FAVORITES_KEY);

          if (!saved) {
            return [];
          }

          const parsed = JSON.parse(saved);

          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      /* ================= SAVE ================= */

      function saveFavorites(favorites) {
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
      }

      /* ================= RENDER ================= */

      function renderFavorites() {
        const saved = getFavorites();

        const savedSet = new Set(saved.map((word) => word.toLowerCase()));

        const favoriteWords = allWords.filter((word) =>
          savedSet.has(word.word.toLowerCase()),
        );

        stats.textContent = `${favoriteWords.length} ${
          favoriteWords.length === 1 ? "word" : "words"
        } saved`;

        if (favoriteWords.length === 0) {
          container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ☆
                </div>

                <h2>
                    No favorites yet
                </h2>

                <p>
                    Open a word and tap
                    "Favorite" to save it here.
                </p>

                <a
                    href="dictionary.html"
                    class="browse"
                >
                    Explore Dictionary →
                </a>

            </div>

        `;

          return;
        }

        container.innerHTML = favoriteWords
          .map(
            (word) => `

                <article
                    class="favorite-card"
                >

                    <div class="card-top">

                        <div>

                            <h2 class="word">
                                ${escapeHTML(word.word)}
                            </h2>

                            <span class="part">
                                ${escapeHTML(word.partOfSpeech)}
                            </span>

                        </div>


                        <button
                            class="remove"
                            title="Remove favorite"
                            onclick="
                                removeFavorite(
                                    '${escapeAttribute(word.word)}'
                                )
                            "
                        >
                            ★
                        </button>

                    </div>


                    <p class="meaning">
                        ${escapeHTML(word.meaning)}
                    </p>


                    <p class="bangla">
                        ${escapeHTML(word.bangla)}
                    </p>


                    <span class="difficulty">
                        ${escapeHTML(word.difficulty)}
                    </span>

                </article>

            `,
          )
          .join("");
      }

      /* ================= REMOVE ================= */

      function removeFavorite(word) {
        const favorites = getFavorites();

        const updated = favorites.filter(
          (item) => item.toLowerCase() !== word.toLowerCase(),
        );

        saveFavorites(updated);

        renderFavorites();
      }

      /* ================= HTML SAFETY ================= */

      function escapeHTML(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttribute(value) {
        return String(value).replaceAll("\\", "\\\\").replaceAll("'", "\\'");
      }

      /* ================= START ================= */

      loadWords();
    </script>
  </body>
</html>
